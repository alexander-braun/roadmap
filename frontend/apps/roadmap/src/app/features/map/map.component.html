<rdmp-header></rdmp-header>

<rdmp-roadmap-navigator
  [navigationItems]="(navigationItems$ | async) || []"
  [allCollapsed]="allSectionsCollapsed"
  (toggleAllSections)="toggleAllSections()"
></rdmp-roadmap-navigator>

<ng-container *ngIf="{ centerNodes: centerNodes$$.asObservable() | async } as center">
  <div class="map" *ngIf="center.centerNodes?.length">
    <div
      *ngFor="let centerNode of center.centerNodes; let i = index; trackBy: trackById"
      class="section"
      [class.section--collapsed]="isCollapsed(centerNode)"
      (transitionend)="onSectionTransitionEnd($event)"
    >
      <!-- Left subchildren -->
      <div class="section__side-elements section__side-elements--left section__side-elements--subchild">
        <div #cardContainer class="section__items">
          <ng-container *ngFor="let child of childrenLeft[i]; trackBy: trackById">
            <ng-container *ngFor="let subChild of subChildrenMapLeft[child]; trackBy: trackById">
              <rdmp-card
                [id]="subChild"
                class="card card--element card--subchild card--left"
                [nodeId]="subChild"
                position="subchild-left"
              ></rdmp-card>
            </ng-container>
          </ng-container>
        </div>
      </div>

      <!-- Left children -->
      <div class="section__side-elements section__side-elements--left">
        <div #cardContainer class="section__items">
          <ng-container *ngFor="let child of childrenLeft[i]; trackBy: trackById">
            <rdmp-card
              [id]="child"
              class="card card--element card--recommended card--left"
              [nodeId]="child"
              position="left"
            ></rdmp-card>
          </ng-container>
        </div>
      </div>

      <!-- Center node -->
      <div
        #cardContainer
        class="section__side-elements section__side-elements--center-section"
        [ngClass]="centerNode === 'last-node' ? 'last-node' : ''"
      >
        <rdmp-card
          *ngIf="centerNode !== 'last-node'"
          [id]="centerNode"
          class="card card--center"
          [nodeId]="centerNode"
          position="center"
          [collapsed]="isCollapsed(centerNode)"
          (toggleCollapse)="toggleSection(centerNode)"
        ></rdmp-card>

        <div class="add-center-node-container">
          <div *ngIf="centerNode !== 'last-node'" class="add-center-circle" (click)="appendCenterNode(centerNode)">
            <div>+</div>
          </div>
        </div>

        <div *ngIf="centerNode === 'last-node'" class="card card--center" [id]="centerNode">
          <div class="last-node-ball"></div>
        </div>
      </div>

      <!-- Right children -->
      <div class="section__side-elements section__side-elements--right">
        <div #cardContainer class="section__items">
          <ng-container *ngFor="let child of childrenRight[i]; trackBy: trackById">
            <rdmp-card
              [id]="child"
              class="card card--element card--recommended card--right"
              [nodeId]="child"
              position="right"
            ></rdmp-card>
          </ng-container>
        </div>
      </div>

      <!-- Right subchildren -->
      <div class="section__side-elements section__side-elements--right section__side-elements--subchild">
        <div #cardContainer class="section__items">
          <ng-container *ngFor="let child of childrenRight[i]; trackBy: trackById">
            <ng-container *ngFor="let subChild of subChildrenMapRight[child]; trackBy: trackById">
              <rdmp-card
                [id]="subChild"
                class="card card--element card--subchild card--right"
                [nodeId]="subChild"
                position="subchild-right"
              ></rdmp-card>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</ng-container>
